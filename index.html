<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Canva Clone</title>
    <!-- Tailwind CSS for fast, modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fabric.js for the graphic design engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
</head>
<body class="bg-gray-200 h-screen flex flex-col font-sans overflow-hidden">
    
    <!-- Top Navigation Bar -->
    <div class="bg-white shadow-md h-16 flex items-center px-6 justify-between z-20">
        <h1 class="font-bold text-2xl text-indigo-600 tracking-tight">DesignApp</h1>
        <button id="download-btn" class="bg-indigo-600 text-white px-5 py-2 rounded-lg shadow hover:bg-indigo-700 font-semibold text-sm transition-all active:scale-95">
            ⬇ Download Design
        </button>
    </div>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Left Sidebar (Tools) -->
        <div class="w-24 md:w-64 bg-white border-r border-gray-200 flex flex-col p-4 space-y-3 z-10 shadow-lg overflow-y-auto">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 hidden md:block">Elements</p>
            
            <button id="add-text-btn" class="bg-gray-50 border border-gray-200 p-3 rounded-xl hover:bg-gray-100 font-medium text-sm md:text-base flex flex-col md:flex-row items-center justify-center md:justify-start gap-2 transition-colors">
                <span class="text-xl">📝</span> <span class="hidden md:inline">Add Text</span>
            </button>
            <button id="add-rect-btn" class="bg-gray-50 border border-gray-200 p-3 rounded-xl hover:bg-gray-100 font-medium text-sm md:text-base flex flex-col md:flex-row items-center justify-center md:justify-start gap-2 transition-colors">
                <span class="text-xl">🟦</span> <span class="hidden md:inline">Add Square</span>
            </button>
            <button id="add-circle-btn" class="bg-gray-50 border border-gray-200 p-3 rounded-xl hover:bg-gray-100 font-medium text-sm md:text-base flex flex-col md:flex-row items-center justify-center md:justify-start gap-2 transition-colors">
                <span class="text-xl">🔴</span> <span class="hidden md:inline">Add Circle</span>
            </button>
            
            <div class="h-px bg-gray-200 my-4"></div>
            
            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 hidden md:block">Canvas</p>
            <div class="flex flex-col mb-4">
                <label class="text-xs font-semibold text-gray-600 mb-2 hidden md:block">Background Color</label>
                <input type="color" id="bg-color-picker" value="#ffffff" class="w-full h-10 cursor-pointer border-0 rounded-lg p-0">
            </div>

            <div class="mt-auto pt-4">
                <button id="delete-btn" class="w-full bg-red-50 text-red-600 border border-red-200 p-3 rounded-xl hover:bg-red-100 font-bold text-sm flex flex-col md:flex-row items-center justify-center md:justify-start gap-2 transition-colors">
                    <span class="text-xl">🗑️</span> <span class="hidden md:inline">Delete</span>
                </button>
            </div>
        </div>

        <!-- Canvas Area -->
        <div id="canvas-container" class="flex-1 flex justify-center items-center bg-gray-100 p-4 overflow-hidden relative">
            <!-- The shadow wrapper makes it look like a physical piece of paper -->
            <div class="shadow-2xl bg-white rounded-sm">
                <canvas id="canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 1. Initialize the Canvas (Default size: 800x800 square)
        const canvas = new fabric.Canvas('canvas', {
            width: 800,
            height: 800,
            backgroundColor: '#ffffff'
        });

        // 2. Make the canvas responsive so it fits nicely on your mobile screen
        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            // Calculate how much to shrink the canvas to fit the screen
            const scale = Math.min(
                (container.clientWidth - 40) / 800,
                (container.clientHeight - 40) / 800
            );
            
            const canvasWrapper = document.querySelector('.canvas-container');
            if(canvasWrapper) {
                canvasWrapper.style.transform = `scale(${scale})`;
                canvasWrapper.style.transformOrigin = 'center center';
            }
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        // 3. Add Text Feature
        document.getElementById('add-text-btn').addEventListener('click', () => {
            const text = new fabric.IText('Double tap to edit', {
                left: 100,
                top: 100,
                fontFamily: 'sans-serif',
                fontSize: 60,
                fill: '#1f2937',
                fontWeight: 'bold'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
            canvas.requestRenderAll();
        });

        // 4. Add Square Feature
        document.getElementById('add-rect-btn').addEventListener('click', () => {
            const rect = new fabric.Rect({
                left: 200,
                top: 200,
                fill: '#4f46e5', // Indigo color
                width: 200,
                height: 200,
                rx: 16, // Rounded corners
                ry: 16
            });
            canvas.add(rect);
            canvas.setActiveObject(rect);
            canvas.requestRenderAll();
        });

        // 5. Add Circle Feature
        document.getElementById('add-circle-btn').addEventListener('click', () => {
            const circle = new fabric.Circle({
                left: 250,
                top: 250,
                fill: '#ef4444', // Red color
                radius: 100
            });
            canvas.add(circle);
            canvas.setActiveObject(circle);
            canvas.requestRenderAll();
        });

        // 6. Change Background Color
        document.getElementById('bg-color-picker').addEventListener('input', (e) => {
            canvas.backgroundColor = e.target.value;
            canvas.requestRenderAll();
        });

        // 7. Delete Selected Object
        document.getElementById('delete-btn').addEventListener('click', () => {
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length) {
                canvas.discardActiveObject();
                activeObjects.forEach(function(object) {
                    canvas.remove(object);
                });
            }
        });

        // 8. Download the finished design
        document.getElementById('download-btn').addEventListener('click', () => {
            // Unselect everything before downloading so bounding boxes don't show
            canvas.discardActiveObject();
            canvas.requestRenderAll();
            
            // Generate a high-quality PNG
            const dataURL = canvas.toDataURL({
                format: 'png',
                quality: 1,
                multiplier: 2 // Exports at 2x resolution
            });
            
            const link = document.createElement('a');
            link.download = 'my-masterpiece.png';
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
