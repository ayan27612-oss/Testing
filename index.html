<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Design Studio</title>
    
    <!-- Premium Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS for High-End Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: '#8b3dff', brandHover: '#742ada', panel: '#ffffff', bg: '#f3f4f6' }
                }
            }
        }
    </script>

    <!-- Fabric.js (Canvas Engine) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    
    <!-- Lucide Icons for Premium UI Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom scrollbar for a sleek look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
        
        .canvas-shadow {
            box-shadow: 0 0 0 1px rgba(0,0,0,0.05), 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
        }
    </style>
</head>
<body class="bg-bg h-screen w-screen flex flex-col font-sans overflow-hidden text-gray-800 text-sm">

    <!-- Top Navigation Bar -->
    <header class="h-14 bg-panel border-b border-gray-200 flex items-center justify-between px-4 shrink-0 z-20">
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 bg-gradient-to-br from-brand to-purple-400 rounded-lg flex items-center justify-center shadow-inner">
                <i data-lucide="palette" class="text-white w-5 h-5"></i>
            </div>
            <span class="font-semibold text-base">Untitled Design</span>
            <span class="text-xs text-gray-400">1080 x 1080 px</span>
        </div>
        
        <div class="flex items-center gap-3">
            <button class="p-2 hover:bg-gray-100 rounded-md transition-colors text-gray-500" title="Undo"><i data-lucide="undo" class="w-4 h-4"></i></button>
            <button class="p-2 hover:bg-gray-100 rounded-md transition-colors text-gray-500" title="Redo"><i data-lucide="redo" class="w-4 h-4"></i></button>
            <div class="w-px h-6 bg-gray-200 mx-2"></div>
            <button class="px-4 py-1.5 hover:bg-gray-100 rounded-md font-medium transition-colors">Share</button>
            <button id="export-btn" class="px-4 py-1.5 bg-brand text-white font-medium rounded-md hover:bg-brandHover shadow-sm transition-colors flex items-center gap-2">
                <i data-lucide="download" class="w-4 h-4"></i> Export
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex flex-1 overflow-hidden">
        
        <!-- Left Sidebar (Primary Tools) -->
        <aside class="w-16 bg-panel border-r border-gray-200 flex flex-col items-center py-4 gap-4 shrink-0 z-10">
            <button class="w-12 h-12 flex flex-col items-center justify-center text-gray-500 hover:text-brand hover:bg-gray-50 rounded-xl transition-all">
                <i data-lucide="layout-template" class="w-5 h-5 mb-1"></i>
                <span class="text-[10px] font-medium">Design</span>
            </button>
            <button class="w-12 h-12 flex flex-col items-center justify-center text-brand bg-purple-50 rounded-xl transition-all">
                <i data-lucide="shapes" class="w-5 h-5 mb-1"></i>
                <span class="text-[10px] font-medium">Elements</span>
            </button>
            <button id="text-tool-btn" class="w-12 h-12 flex flex-col items-center justify-center text-gray-500 hover:text-brand hover:bg-gray-50 rounded-xl transition-all">
                <i data-lucide="type" class="w-5 h-5 mb-1"></i>
                <span class="text-[10px] font-medium">Text</span>
            </button>
            <button class="w-12 h-12 flex flex-col items-center justify-center text-gray-500 hover:text-brand hover:bg-gray-50 rounded-xl transition-all">
                <i data-lucide="image" class="w-5 h-5 mb-1"></i>
                <span class="text-[10px] font-medium">Uploads</span>
            </button>
        </aside>

        <!-- Left Secondary Panel (Element Options) -->
        <aside class="w-72 bg-panel border-r border-gray-200 flex flex-col shrink-0 z-10">
            <div class="p-4 border-b border-gray-100">
                <h2 class="font-semibold text-base mb-3">Shapes</h2>
                <div class="grid grid-cols-3 gap-2">
                    <button id="add-square" class="aspect-square bg-gray-50 border border-gray-200 rounded-lg hover:border-brand flex items-center justify-center transition-all group">
                        <div class="w-8 h-8 bg-gray-300 rounded-sm group-hover:bg-brand transition-colors"></div>
                    </button>
                    <button id="add-circle" class="aspect-square bg-gray-50 border border-gray-200 rounded-lg hover:border-brand flex items-center justify-center transition-all group">
                        <div class="w-8 h-8 bg-gray-300 rounded-full group-hover:bg-brand transition-colors"></div>
                    </button>
                    <button id="add-triangle" class="aspect-square bg-gray-50 border border-gray-200 rounded-lg hover:border-brand flex items-center justify-center transition-all group">
                        <div class="w-0 h-0 border-l-[16px] border-l-transparent border-b-[30px] border-b-gray-300 border-r-[16px] border-r-transparent group-hover:border-b-brand transition-colors"></div>
                    </button>
                </div>
            </div>
            <div class="p-4 flex-1 overflow-y-auto">
                <h2 class="font-semibold text-base mb-3">Images (Stock)</h2>
                <p class="text-xs text-gray-500 mb-4">Stock API integration goes here in future updates.</p>
                <div class="w-full h-32 bg-gray-100 rounded-lg border-2 border-dashed border-gray-300 flex items-center justify-center text-gray-400">
                    <i data-lucide="image-plus" class="w-6 h-6"></i>
                </div>
            </div>
        </aside>

        <!-- Canvas Area -->
        <section id="workspace" class="flex-1 flex items-center justify-center relative overflow-auto">
            <!-- Canvas Wrapper for visual styling -->
            <div class="canvas-shadow bg-white transition-transform duration-200 ease-out" id="canvas-wrapper">
                <canvas id="main-canvas"></canvas>
            </div>
        </section>

        <!-- Right Sidebar (Properties Panel) -->
        <aside class="w-64 bg-panel border-l border-gray-200 flex flex-col shrink-0 z-10">
            <!-- No Object Selected State -->
            <div id="no-selection-panel" class="p-6 text-center text-gray-400 flex flex-col items-center justify-center h-full">
                <i data-lucide="mouse-pointer-2" class="w-8 h-8 mb-3 opacity-50"></i>
                <p>Select an element on the canvas to edit its properties.</p>
            </div>

            <!-- Active Object Selected State (Hidden by default) -->
            <div id="properties-panel" class="hidden flex-col h-full">
                <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                    <h3 class="font-semibold">Properties</h3>
                    <button id="delete-element" class="p-1.5 text-red-500 hover:bg-red-50 rounded-md transition-colors" title="Delete">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
                
                <div class="p-4 space-y-5 flex-1 overflow-y-auto">
                    <!-- Color Picker -->
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-2">Fill Color</label>
                        <div class="flex items-center gap-3">
                            <input type="color" id="prop-color" class="w-10 h-10 rounded border-0 cursor-pointer p-0 bg-transparent">
                            <span id="prop-color-hex" class="text-xs font-mono uppercase text-gray-600">#000000</span>
                        </div>
                    </div>

                    <!-- Opacity Slider -->
                    <div>
                        <div class="flex justify-between mb-2">
                            <label class="text-xs font-medium text-gray-500">Opacity</label>
                            <span id="prop-opacity-val" class="text-xs text-gray-600">100%</span>
                        </div>
                        <input type="range" id="prop-opacity" min="0" max="1" step="0.01" value="1" class="w-full accent-brand">
                    </div>

                    <div class="h-px bg-gray-100 w-full"></div>

                    <!-- Action Buttons -->
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btn-bring-front" class="px-3 py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded text-xs font-medium transition-colors">Bring Forward</button>
                        <button id="btn-send-back" class="px-3 py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded text-xs font-medium transition-colors">Send Backward</button>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // 1. Setup Canvas Engine
        // Emulating a 1080x1080 Instagram post size
        const canvas = new fabric.Canvas('main-canvas', {
            width: 1080,
            height: 1080,
            backgroundColor: '#ffffff',
            preserveObjectStacking: true // Keeps selected objects from jumping to the absolute top
        });

        // Setup Custom Corner Controls to look premium
        fabric.Object.prototype.set({
            transparentCorners: false,
            cornerColor: '#ffffff',
            cornerStrokeColor: '#8b3dff',
            borderColor: '#8b3dff',
            cornerSize: 10,
            padding: 5,
            cornerStyle: 'circle'
        });

        // 2. Responsive Scaling for the Workspace
        function fitCanvasToWorkspace() {
            const workspace = document.getElementById('workspace');
            const wrapper = document.getElementById('canvas-wrapper');
            
            // Allow 40px padding around the canvas
            const padding = 80; 
            const scaleX = (workspace.clientWidth - padding) / 1080;
            const scaleY = (workspace.clientHeight - padding) / 1080;
            const scale = Math.min(scaleX, scaleY);
            
            wrapper.style.transform = `scale(${scale})`;
            wrapper.style.transformOrigin = 'center center';
        }
        window.addEventListener('resize', fitCanvasToWorkspace);
        setTimeout(fitCanvasToWorkspace, 100);

        // 3. UI Interactions: Add Elements
        document.getElementById('text-tool-btn').addEventListener('click', () => {
            const text = new fabric.IText('Double click to edit', {
                left: 100, top: 100,
                fontFamily: 'Inter', fontSize: 80,
                fill: '#111827', fontWeight: 'bold'
            });
            canvas.add(text);
            canvas.setActiveObject(text);
        });

        document.getElementById('add-square').addEventListener('click', () => {
            const rect = new fabric.Rect({
                left: 340, top: 340,
                width: 400, height: 400,
                fill: '#8b3dff', rx: 20, ry: 20
            });
            canvas.add(rect);
            canvas.setActiveObject(rect);
        });

        document.getElementById('add-circle').addEventListener('click', () => {
            const circle = new fabric.Circle({
                left: 340, top: 340,
                radius: 200, fill: '#3b82f6'
            });
            canvas.add(circle);
            canvas.setActiveObject(circle);
        });

        document.getElementById('add-triangle').addEventListener('click', () => {
            const triangle = new fabric.Triangle({
                left: 340, top: 340,
                width: 400, height: 400,
                fill: '#10b981'
            });
            canvas.add(triangle);
            canvas.setActiveObject(triangle);
        });

        // 4. Properties Panel Logic
        const noSelectionPanel = document.getElementById('no-selection-panel');
        const propertiesPanel = document.getElementById('properties-panel');
        const colorPicker = document.getElementById('prop-color');
        const colorHex = document.getElementById('prop-color-hex');
        const opacitySlider = document.getElementById('prop-opacity');
        const opacityVal = document.getElementById('prop-opacity-val');

        // When an object is clicked, show its settings
        canvas.on('selection:created', updatePropertiesPanel);
        canvas.on('selection:updated', updatePropertiesPanel);
        canvas.on('selection:cleared', () => {
            noSelectionPanel.classList.remove('hidden');
            propertiesPanel.classList.add('hidden');
            propertiesPanel.classList.remove('flex');
        });

        function updatePropertiesPanel() {
            const activeObj = canvas.getActiveObject();
            if (!activeObj) return;

            noSelectionPanel.classList.add('hidden');
            propertiesPanel.classList.remove('hidden');
            propertiesPanel.classList.add('flex');

            // Sync Color
            if (activeObj.fill && typeof activeObj.fill === 'string') {
                colorPicker.value = activeObj.fill;
                colorHex.textContent = activeObj.fill.toUpperCase();
            }
            // Sync Opacity
            opacitySlider.value = activeObj.opacity || 1;
            opacityVal.textContent = Math.round((activeObj.opacity || 1) * 100) + '%';
        }

        // Change Color
        colorPicker.addEventListener('input', (e) => {
            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                activeObj.set('fill', e.target.value);
                colorHex.textContent = e.target.value.toUpperCase();
                canvas.renderAll();
            }
        });

        // Change Opacity
        opacitySlider.addEventListener('input', (e) => {
            const activeObj = canvas.getActiveObject();
            if (activeObj) {
                activeObj.set('opacity', parseFloat(e.target.value));
                opacityVal.textContent = Math.round(e.target.value * 100) + '%';
                canvas.renderAll();
            }
        });

        // Layers and Delete
        document.getElementById('delete-element').addEventListener('click', () => {
            const activeObjects = canvas.getActiveObjects();
            if (activeObjects.length) {
                canvas.discardActiveObject();
                activeObjects.forEach((obj) => canvas.remove(obj));
            }
        });

        document.getElementById('btn-bring-front').addEventListener('click', () => {
            const obj = canvas.getActiveObject();
            if (obj) { canvas.bringForward(obj); canvas.discardActiveObject(); canvas.setActiveObject(obj); }
        });

        document.getElementById('btn-send-back').addEventListener('click', () => {
            const obj = canvas.getActiveObject();
            if (obj) { canvas.sendBackwards(obj); canvas.discardActiveObject(); canvas.setActiveObject(obj); }
        });

        // 5. Export Logic
        document.getElementById('export-btn').addEventListener('click', () => {
            canvas.discardActiveObject();
            canvas.renderAll();
            const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });
            const link = document.createElement('a');
            link.download = 'design-export.png';
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
